version: "3.9"

services:
  postgres:
    image: postgres:16.2
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      - postgres
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8081:8080"
    networks:
      - keycloak_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - keycloak_network

  service-keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-keycloak
    restart: unless-stopped
    depends_on:
      - redis
      # Descomenta si quieres levantar el Keycloak local
      # - keycloak
    environment:
      SPRING_PROFILES_ACTIVE: dev

      # Keycloak remoto (unicauca)
      KEYCLOAK_ISSUER_URI: "http://contables.unicauca.edu.co:80/auth/realms/oauth2-realm"
      KEYCLOAK_JWK_SET_URI: "http://contables.unicauca.edu.co:80/auth/realms/oauth2-realm/protocol/openid-connect/certs"
      KEYCLOAK_ADMIN: "admin-cli"
      KEYCLOAK_PASSWORD: "kPiP4WSxSH9Gdq"
      KEYCLOAK_USER_CONSOLE: "contables"
      KEYCLOAK_CLIENT_SECRET: "mKJksN0JuOdMHThJmNre8Sv5q3CnO8ZK"
      KEYCLOAK_SERVER_URL: "http://contables.unicauca.edu.co/auth"
      KEYCLOAK_REALM_NAME: "oauth2-realm"
      KEYCLOAK_REALM_MASTER: "master"
      PRINCIPLE_ATTRIBUTE: "preferred_username"
      KEYCLOAK_CLIENT_ID: "341fd012-a3d7-4223-8cf9-abd4292fd4bb"
      RESOURCE_ID: "microservices_client"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Mail (ajusta con tu SMTP real)
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USER: user@gmail.com
      MAIL_PASS: app-password

      # Recovery
      RECOVERY_FRONTEND_URL: http://localhost:5173/reset-password
      RECOVERY_TTL_SECONDS: 3600
    ports:
      - "8080:8080"
    networks:
      - keycloak_network

volumes:
  postgres_data:

networks:
  keycloak_network:
    driver: bridge
