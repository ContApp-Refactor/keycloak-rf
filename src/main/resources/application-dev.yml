spring:
  application:
    name: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

          

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org:
      Keycloak: DEBUG

jwt:
  auth:
    converter:
      principle-attribute: ${PRINCIPLE_ATTRIBUTE}
      resource-id: ${RESOURCE_ID}
  app:
  recovery:
    base-url: ${RECOVERY_FRONTEND_URL:http://localhost:5173/reset-password}
    ttl-seconds: ${RECOVERY_TTL_SECONDS:3600}
  jwt:
    blacklist-prefix: jwt:black:
    recovery-prefix: pwd:reset:
  session:
    idle-seconds: 1800
    
  public:
    key: ${JWT_PUBLIC_KEY}
  token:
    url: ${JWT_TOKEN_URL}

keycloak:
  admin: ${KEYCLOAK_ADMIN}
  password: ${KEYCLOAK_PASSWORD}
  user:
    console: ${KEYCLOAK_USER_CONSOLE}
  client:
    id: ${KEYCLOAK_CLIENT_ID}
    secret: ${KEYCLOAK_CLIENT_SECRET}
  server:
    url: ${KEYCLOAK_SERVER_URL}
  realm: 
    name: ${KEYCLOAK_REALM_NAME}
    master: ${KEYCLOAK_REALM_MASTER}

server:
  port: ${PORT:0}

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.uuid}"
    hostname: ${INSTANCE_HOSTNAME:localhost}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
      
management:
  endpoint:
    health:
      probes:
        enabled: true
